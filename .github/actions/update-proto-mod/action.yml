name: Update Proto Mod
description: 下游仓库手动升级 proto 模块引用（go get + tidy + build 验证 + 推送目标分支）

inputs:
  branch:
    description: 推送目标分支
    required: true
  module:
    description: proto 模块名（如 xxx-share-proto）
    required: true
  module-ref:
    description: 模块版本引用（默认 master）
    required: false
    default: master

runs:
  using: composite
  steps:
    - name: Run Update Proto Mod
      shell: bash
      env:
        PROTO_READ_TOKEN: ${{ env.PROTO_READ_TOKEN }}
        PUSH_TOKEN: ${{ env.PUSH_TOKEN }}
      run: |
        # 同 notify：用 action 自带的仓库副本，不克隆（私有仓库靠 Access 放开引用权限）
        # [EN] As in notify: use the copy shipped with the action, never clone.
        script="${GITHUB_ACTION_PATH}/../../../scripts/update-proto-mod.sh"
        if [ ! -f "${script}" ]; then
          echo "::error::找不到 ${script}；请确认 action 与 scripts/update-proto-mod.sh 在同一仓库同一 ref" >&2
          exit 1
        fi
        bash "${script}" \
          "${{ inputs.branch }}" \
          "${{ inputs.module }}" \
          "${{ inputs.module-ref }}"

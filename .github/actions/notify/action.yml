name: 'Notify'
description: '通用通知（飞书/企业微信/Telegram），支持自定义标题与正文，供任意 workflow 复用；webhook 凭证通过调用方 step env 注入（FEISHU_WEBHOOK_URL / WECOM_WEBHOOK_URL / WECOM_WEBHOOK_KEY / TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID）'

inputs:
  provider:
    description: '通知提供商: feishu | wecom | telegram | all | none（all 只发已配置的渠道）'
    required: true
  status:
    description: '通知状态: success | failure | warning | info'
    required: false
    default: 'success'
  title:
    description: '自定义标题'
    required: false
    default: ''
  message:
    description: '自定义正文（飞书 lark_md / 企业微信 markdown / Telegram Markdown，支持多行）'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Send Notification
      shell: bash
      env:
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_STATUS: ${{ inputs.status }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_MESSAGE: ${{ inputs.message }}
      run: |
        export NOTIFICATION_PROVIDER="${INPUT_PROVIDER}"
        export NOTIFICATION_TYPE="custom"
        export STATUS="${INPUT_STATUS}"
        export CUSTOM_TITLE="${INPUT_TITLE}"
        export CUSTOM_MESSAGE="${INPUT_MESSAGE}"
        export WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        # 用 action 自带的仓库副本，不克隆：远程引用 action 时 runner 已把整个仓库下载到
        # _actions 下（私有仓库靠 Settings → Actions → General → Access 放开引用权限），
        # 所以 sibling 脚本用 GITHUB_ACTION_PATH 相对定位即可。
        # 不要改回 git clone：那是裸 git 操作，拿不到私有仓库凭据，会以
        # "could not read Username for 'https://github.com'" 失败（exit 128），
        # 且 Access 设置并不会为它提供凭据
        # [EN] Use the repository copy shipped with the action instead of cloning: the runner
        # already downloads the whole repository under _actions (for a private repository this
        # needs Settings -> Actions -> General -> Access), so the sibling script is addressable
        # through GITHUB_ACTION_PATH. Do not go back to git clone: it is a bare git operation
        # with no credentials for a private repository and fails with "could not read Username
        # for 'https://github.com'" (exit 128); the Access setting does not supply credentials.
        script="${GITHUB_ACTION_PATH}/../../../scripts/notify.sh"
        if [ ! -f "${script}" ]; then
          echo "::error::找不到 ${script}；请确认 action 与 scripts/notify.sh 在同一仓库同一 ref" >&2
          exit 1
        fi
        bash "${script}"

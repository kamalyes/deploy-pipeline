name: 'Notify'
description: '通用通知（飞书/企业微信/Telegram），支持自定义标题与正文，供任意 workflow 复用；webhook 凭证通过调用方 step env 注入（FEISHU_WEBHOOK_URL / WECOM_WEBHOOK_URL / WECOM_WEBHOOK_KEY / TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID）'

inputs:
  provider:
    description: '通知提供商: feishu | wecom | telegram | all | none（all 只发已配置的渠道）'
    required: true
  status:
    description: '通知状态: success | failure | warning | info'
    required: false
    default: 'success'
  title:
    description: '自定义标题'
    required: false
    default: ''
  message:
    description: '自定义正文（飞书 lark_md / 企业微信 markdown / Telegram Markdown，支持多行）'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Send Notification
      shell: bash
      env:
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_STATUS: ${{ inputs.status }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_MESSAGE: ${{ inputs.message }}
      run: |
        export NOTIFICATION_PROVIDER="${INPUT_PROVIDER}"
        export NOTIFICATION_TYPE="custom"
        export STATUS="${INPUT_STATUS}"
        export CUSTOM_TITLE="${INPUT_TITLE}"
        export CUSTOM_MESSAGE="${INPUT_MESSAGE}"
        export WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        # GitHub 远程引用 composite action 时仅下载 action 目录，不含仓库其余文件
        # 浅克隆本仓库获取 scripts/notify.sh，保持通知逻辑单一实现源
        clone_dir="${RUNNER_TEMP}/deploy-pipeline-notify"
        git clone --depth=1 https://github.com/kamalyes/deploy-pipeline.git "${clone_dir}"
        bash "${clone_dir}/scripts/notify.sh"

name: 🚀 Build Binary

on:
  workflow_call:
    inputs:
      # ============================================
      # 动态值（每次调用不同，必须传入）
      # ============================================
      binary-name:
        description: 'Binary name'
        required: true
        type: string
      binary-source-dir:
        description: 'Binary source directory'
        required: true
        type: string
      binary-output:
        description: 'Binary output path'
        required: true
        type: string
      version:
        description: 'Build version'
        required: true
        type: string
      build-time:
        description: 'Build time'
        required: true
        type: string
      git-commit:
        description: 'Git commit hash'
        required: true
        type: string
      # ============================================
      # 可覆盖的静态配置（有默认值，优先读 vars）
      # ============================================
      go-version:
        description: 'Go version (overrides vars.GO_VERSION)'
        required: false
        type: string
        default: ''
      goproxy:
        description: 'Go module proxy (overrides vars.GOPROXY)'
        required: false
        type: string
        default: ''
      goprivate:
        description: 'Go private modules (overrides vars.GOPRIVATE)'
        required: false
        type: string
        default: ''
      go-auth-method:
        description: 'Go private module auth method: app-token | ssh | none'
        required: false
        type: string
        default: ''
      upx-compress:
        description: 'Enable UPX compression (overrides vars.UPX_COMPRESS)'
        required: false
        type: string
        default: ''
      upx-level:
        description: 'UPX compression level (overrides vars.UPX_LEVEL, e.g. -2 fast / --best --lzma smallest, default --best --lzma)'
        required: false
        type: string
        default: ''
      retention-days:
        description: 'Artifact retention days (smaller value reduces storage usage)'
        required: false
        type: string
        default: '7'
      os:
        description: 'Target OS（为空时回退到 vars.BUILD_BINARY_OS，再为空用 linux）'
        required: false
        type: string
        default: ''
      arch:
        description: '目标架构（amd64 或 arm64，为空时回退到 vars.BUILD_BINARY_ARCH，再为空用 amd64）。每次构建只产出一个架构二进制，由调用方按目标集群节点架构选择'
        required: false
        type: string
        default: ''
      runner:
        description: 'GitHub runner 标签（默认 ubuntu-latest=2核；可选 ubuntu-latest-4-cores/8-cores/16-cores/32-cores 等更大付费 runner）'
        required: false
        type: string
        default: 'ubuntu-latest'
      build-script:
        description: 'Path to build script (relative to repo root)'
        required: false
        type: string
        default: 'scripts/backend/build-linux.sh'
      binary-build-dir:
        description: 'Build directory containing main package (e.g. ./bootstrap), overrides default repo root'
        required: false
        type: string
        default: ''
      build-tags:
        description: '额外 Go 构建标签，附加在默认 netgo 之后（如 swagger 用于嵌入 swagger 文档，仅需要的服务启用）'
        required: false
        type: string
        default: ''
    secrets:
      # 聚合密钥：一个 secret 装下私有模块凭证，格式见 scripts/config/schema.yaml
      # [EN] One secret holding the private-module credentials; see scripts/config/schema.yaml
      PIPELINE_SECRETS:
        description: '聚合密钥 YAML（go.app_id / go.app_private_key / go.git_ssh_private_key），优先级高于下面的单个 secret'
        required: false
      APP_ID:
        description: 'GitHub App ID (for app-token auth)'
        required: false
      APP_PRIVATE_KEY:
        description: 'GitHub App Private Key (for app-token auth)'
        required: false
      GIT_SSH_PRIVATE_KEY:
        description: 'Git SSH 私钥内容 (for ssh auth, legacy)'
        required: false

jobs:
  build-binary:
    # job-level name 不能引用 env.*（此时 env 尚未初始化），用 inputs/vars 表达式直接拼
    name: 🚀 Build Go Binary
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    steps:
      # 所有配置先过这一步：校验 YAML、合并优先级、写进 GITHUB_ENV
      # [EN] Every setting goes through this step first
      - name: ⚙️ Resolve Pipeline Config
        id: config
        uses: kamalyes/deploy-pipeline/.github/actions/resolve-config@master
        with:
          sections: builder
          secret-sections: go
          vars-json: ${{ toJSON(vars) }}
          inputs-json: ${{ toJSON(inputs) }}
          secrets-json: ${{ toJSON(secrets) }}

      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 🖥️ Print Runner Info
        uses: kamalyes/deploy-pipeline/.github/actions/print-runner-info@master

      # 不用 actions/checkout 取本仓库：复用工作流里 GITHUB_TOKEN 的作用域是调用方仓库，
      # 对本私有仓库没有读权限，GitHub 返回 404 而不是 403，报错是
      # "remote: Repository not found."，看着像仓库不存在其实是没权限。
      # 详见 .github/actions/fetch-pipeline-assets/action.yml 的说明。
      # [EN] Not actions/checkout: inside a reusable workflow GITHUB_TOKEN is scoped to the
      # calling repository and cannot read this private one, and GitHub answers 404 rather than
      # 403, so the error reads as a missing repository when it is a permission
      - name: 📥 Fetch Pipeline Assets (scripts)
        uses: kamalyes/deploy-pipeline/.github/actions/fetch-pipeline-assets@master
        with:
          assets: scripts

      - name: 🗄️ Cache UPX
        if: env.UPX_COMPRESS == 'true'
        uses: actions/cache@v4
        with:
          path: |
            /usr/bin/upx
            /usr/bin/upx-ucl
          key: upx-${{ runner.os }}-ucl
          restore-keys: |
            upx-${{ runner.os }}-

      # ============================================
      # Auth Method: app-token
      # 使用 GitHub App 生成临时 Token 拉取私有模块
      # 条件：GO_AUTH_METHOD == 'app-token'（不依赖 GOPRIVATE 是否为空）
      # ============================================
      - name: 🔑 Generate GitHub App Token
        if: env.GO_AUTH_METHOD == 'app-token'
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: ⚙️ Configure Git for App Token Auth
        if: env.GO_AUTH_METHOD == 'app-token'
        run: |
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          if [ -n "${GOPRIVATE}" ]; then
            echo "GOPRIVATE=${GOPRIVATE}" >> "$GITHUB_ENV"
          fi

      # ============================================
      # Auth Method: ssh (legacy)
      # 使用 SSH 私钥拉取私有模块
      # 条件：GO_AUTH_METHOD == 'ssh'（不依赖 GOPRIVATE 是否为空）
      # ============================================
      - name: 🔑 Setup SSH Key for Private Modules
        if: env.GO_AUTH_METHOD == 'ssh'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.GIT_SSH_PRIVATE_KEY }}

      - name: ⚙️ Configure Git for SSH Auth
        if: env.GO_AUTH_METHOD == 'ssh'
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          if [ -n "${GOPRIVATE}" ]; then
            echo "GOPRIVATE=${GOPRIVATE}" >> "$GITHUB_ENV"
          fi

      - name: 🛠️ Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          # 内置模块缓存：以 go.sum 为 key，自动管理 cache 生命周期，无需手动配置
          cache: true

      - name: 📦 Download Dependencies
        run: |
          export GOPROXY="${{ env.GOPROXY }}"
          if [ -n "${{ env.GOPRIVATE }}" ]; then
            export GOPRIVATE="${{ env.GOPRIVATE }}"
          fi
          go mod download

      - name: 🔨 Build Binary
        run: |
          if [ -f "${{ inputs.build-script }}" ]; then
            BUILD_SCRIPT="${{ inputs.build-script }}"
          else
            BUILD_SCRIPT="_deploy-workflows/scripts/backend/build-linux.sh"
          fi
          chmod +x "${BUILD_SCRIPT}"

          ./${BUILD_SCRIPT} \
            --version "${{ inputs.version }}" \
            --build-time "${{ inputs.build-time }}" \
            --git-commit "${{ inputs.git-commit }}" \
            --binary-name "${{ inputs.binary-name }}" \
            --output-dir "${{ inputs.binary-source-dir }}" \
            --os "${{ env.BUILD_BINARY_OS }}" \
            --arch "${{ env.BUILD_BINARY_ARCH }}" \
            --upx-compress "${{ env.UPX_COMPRESS }}" \
            --upx-level "${{ env.UPX_LEVEL }}" \
            --build-dir "${{ inputs.binary-build-dir }}" \
            --build-tags "${{ inputs.build-tags }}"

          echo "Build completed: ${{ inputs.binary-name }} (${{ env.BUILD_BINARY_OS }}/${{ env.BUILD_BINARY_ARCH }})"
          ls -lh "${{ inputs.binary-source-dir }}"

      - name: 🧾 Resolve Artifact Paths
        id: artifact-paths
        # buildinfo.txt 的路径从 binary-output 的目录推出来，而不是直接用 binary-source-dir。
        # 原因：upload-artifact v4 以「所有匹配文件的最近公共祖先」为产物根目录。
        # 如果某个调用方的 binary-output 是嵌套路径（deployments/bin/app），而 buildinfo
        # 用的是 binary-source-dir（deployments），公共祖先就会上移一层，二进制在产物里
        # 变成 bin/app 而不是 app，下游 docker job 的 COPY ./app 就找不到文件了
        # 两个文件取同一个目录，公共祖先与改动前完全一致，二进制位置不受影响
        run: |
          BINARY_DIR="$(dirname "${{ inputs.binary-output }}")"
          echo "buildinfo=${BINARY_DIR}/buildinfo.txt" >> $GITHUB_OUTPUT

      - name: 📤 Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.binary-name }}-binary
          # buildinfo.txt 由 scripts/backend/build-linux.sh 生成；
          # 调用方若用自己的构建脚本且没写这个文件，warn 跳过即可，不要让 job 变红
          path: |
            ${{ inputs.binary-output }}
            ${{ steps.artifact-paths.outputs.buildinfo }}
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}

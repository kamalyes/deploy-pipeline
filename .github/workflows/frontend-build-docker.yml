name: 🐳 Build Frontend Docker Image

# ============================================
# 前端 Docker 构建工作流
# 用途：将前端构建产物打包为 Docker 镜像并推送到镜像仓库
# 支持项目自定义 nginx.conf 配置
# ============================================

on:
  workflow_call:
    inputs:
      # ============================================
      # 必选参数
      # ============================================
      app-name:
        description: '前端应用名称'
        required: true
        type: string

      version:
        description: '构建版本号'
        required: true
        type: string

      docker-registry:
        description: 'Docker 镜像仓库地址（如：ghcr.io）'
        required: true
        type: string

      image-base:
        description: '基础镜像名称（不带 tag）'
        required: true
        type: string

      image-name:
        description: '完整镜像名称（带 tag）'
        required: true
        type: string

      # ============================================
      # 可选参数
      # ============================================
      http-port:
        description: 'HTTP 端口'
        required: false
        type: string
        default: ''

      environment:
        description: '部署环境'
        required: false
        type: string
        default: 'dev'

      base-image:
        description: '基础 Docker 镜像（Nginx）'
        required: false
        type: string
        default: ''

      timezone:
        description: '容器时区'
        required: false
        type: string
        default: ''

      build-output-dir:
        description: '前端构建输出目录'
        required: false
        type: string
        default: 'dist'

      nginx-config-path:
        description: '项目自定义 nginx.conf 路径（为空则使用默认配置）'
        required: false
        type: string
        default: ''

      artifact-name:
        description: '构建产物 Artifact 名称（需与 build-frontend 的 artifact-name 一致）'
        required: false
        type: string
        default: 'frontend-dist'

      os:
        description: '目标 OS（为空时回退到 vars.BUILD_DOCKER_OS，再为空用 linux）'
        required: false
        type: string
        default: ''

      arch:
        description: '目标架构（amd64 或 arm64，为空时回退到 vars.BUILD_DOCKER_ARCH，再为空用 amd64）。与 os 一起拼成 ${os}/${arch} 传给 build-push-action 的 platforms'
        required: false
        type: string
        default: ''

      runner:
        description: 'GitHub runner 标签（默认 ubuntu-latest=2核；可选 ubuntu-latest-4-cores/8-cores/16-cores/32-cores 等更大付费 runner）'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      # 聚合密钥：一个 secret 装下镜像仓库凭证，格式见 scripts/config/schema.yaml
      # [EN] One secret holding the registry credentials; see scripts/config/schema.yaml
      PIPELINE_SECRETS:
        description: '聚合密钥 YAML（docker.username / docker.password），优先级高于下面的单个 secret'
        required: false
      DOCKER_USERNAME:
        description: 'Docker registry username'
        required: false
      DOCKER_PASSWORD:
        description: 'Docker registry password or token'
        required: false

jobs:
  build-docker:
    name: 🐳 Build Frontend Docker Image
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write

    outputs:
      # 平台要跨 job 传给 release-note：job 级字段取不到 GITHUB_ENV，只能走 step 输出
      # [EN] release-note needs the platform across jobs, and a job-level field cannot read
      # GITHUB_ENV, so it comes from the resolve step's output
      platform: ${{ fromJSON(steps.config.outputs.json).BUILD_DOCKER_OS }}/${{ fromJSON(steps.config.outputs.json).BUILD_DOCKER_ARCH }}

    steps:
      # 所有配置先过这一步：校验 YAML、合并优先级、写进 GITHUB_ENV
      # [EN] Every setting goes through this step first
      - name: ⚙️ Resolve Pipeline Config
        id: config
        uses: kamalyes/deploy-pipeline/.github/actions/resolve-config@master
        with:
          # 要 ports 节：nginx 的 listen / EXPOSE 和 deploy 用的 Service 端口必须是同一个值，
          # 两边都从 ports.http 取就不会一边改了另一边忘改
          # [EN] The ports section is requested because nginx's listen and EXPOSE must agree with
          # the Service port used at deploy time; both now read ports.http
          sections: ports docker
          secret-sections: docker
          vars-json: ${{ toJSON(vars) }}
          inputs-json: ${{ toJSON(inputs) }}
          secrets-json: ${{ toJSON(secrets) }}
          # 前端运行镜像是 nginx，不是后端那套 alpine
          # [EN] The frontend runtime image is nginx rather than the backend's alpine
          defaults: |
            HTTP_PORT=80
            BASE_IMAGE=nginx:1.25.3-alpine
            DOCKER_USERNAME=${{ github.actor }}
            DOCKER_PASSWORD=${{ secrets.GITHUB_TOKEN }}

      # ============================================
      # 步骤1：检出代码仓库
      # ============================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 🖥️ Print Runner Info
        uses: kamalyes/deploy-pipeline/.github/actions/print-runner-info@master

      # ============================================
      # 步骤2：下载前端构建产物
      # ============================================
      - name: 📤 Download Frontend Dist
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.build-output-dir }}

      # ============================================
      # 步骤3：生成 Dockerfile 和 Nginx 配置
      # 优先使用项目自定义的 nginx.conf，不存在则使用默认配置
      # ============================================
      - name: 📝 Generate Dockerfile and Nginx Config
        run: |
          BUILD_OUTPUT_DIR="${{ inputs.build-output-dir }}"
          APP_NAME="${{ inputs.app-name }}"
          BASE_IMAGE="${{ inputs.base-image }}"
          TIMEZONE="${{ env.TIMEZONE }}"
          HTTP_PORT="${{ env.HTTP_PORT }}"
          NGINX_CONFIG_PATH="${{ inputs.nginx-config-path }}"

          echo "================================================"
          echo "正在生成 Dockerfile 和 Nginx 配置"
          echo "构建输出目录: $BUILD_OUTPUT_DIR"
          echo "应用名称: $APP_NAME"
          echo "基础镜像: $BASE_IMAGE"
          echo "HTTP 端口: $HTTP_PORT"
          echo "自定义 Nginx 配置路径: ${NGINX_CONFIG_PATH:-未指定，将使用默认配置}"
          echo "================================================"

          cat << EOF > ${BUILD_OUTPUT_DIR}/Dockerfile
          FROM ${BASE_IMAGE}
          USER root
          STOPSIGNAL SIGQUIT
          WORKDIR /usr/share/nginx/html
          COPY ./ ./
          RUN rm -rf /etc/nginx/conf.d/default.conf
          COPY ./nginx.conf /etc/nginx/conf.d/default.conf
          RUN chown -R nginx:nginx /usr/share/nginx/html /var/cache/nginx /var/log/nginx
          EXPOSE ${HTTP_PORT}
          CMD ["nginx", "-g", "daemon off;"]
          EOF

          if [ -n "${NGINX_CONFIG_PATH}" ] && [ -f "${NGINX_CONFIG_PATH}" ]; then
            echo "发现项目自定义 Nginx 配置，正在复制..."
            cp "${NGINX_CONFIG_PATH}" "${BUILD_OUTPUT_DIR}/nginx.conf"
          else
            echo "未找到自定义 Nginx 配置，生成默认配置..."
            cat << EOF > ${BUILD_OUTPUT_DIR}/nginx.conf
          server {
              listen ${HTTP_PORT};
              server_name localhost;
              root /usr/share/nginx/html;
              index index.html;
              charset utf-8;

              gzip on;
              gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

              location / {
                  try_files \$uri \$uri/ /index.html;
              }

              location ~* \\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)\$ {
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }
          }
          EOF
          fi

          echo ""
          echo "=== 生成的 Dockerfile ==="
          cat ${BUILD_OUTPUT_DIR}/Dockerfile
          echo ""
          echo "=== 生成/使用的 nginx.conf ==="
          cat ${BUILD_OUTPUT_DIR}/nginx.conf

      # ============================================
      # 步骤4：登录 Docker 镜像仓库
      # ============================================
      - name: 🔐 Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Normalize Docker Image Names
        id: image-names
        uses: kamalyes/deploy-pipeline/.github/actions/normalize-image-name@master
        with:
          image-base: ${{ inputs.image-base }}
          image-name: ${{ inputs.image-name }}
          generate-tags: 'true'

      # ============================================
      # 步骤5：提取镜像元数据
      # ============================================
      - name: 📊 Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-names.outputs.image-base }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # ============================================
      # 步骤6：构建并推送 Docker 镜像
      # ============================================
      - name: 🔨 Build and Push Docker Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.build-output-dir }}
          file: ${{ inputs.build-output-dir }}/Dockerfile
          push: true
          # 关键：用 ${os}/${arch} 标记镜像 manifest 平台，K8s 调度到对应架构节点时才能正确拉取
          # 优先级: inputs > vars.BUILD_DOCKER_OS/ARCH > 硬编码默认值
          # 前端是纯静态文件，nginx:alpine 基础镜像本身支持多架构，Dockerfile 无需 ARG TARGETARCH
          platforms: ${{ env.BUILD_DOCKER_OS }}/${{ env.BUILD_DOCKER_ARCH }}
          tags: ${{ steps.image-names.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📊 Generate Build Report
        if: ${{ always() }}
        run: |
          # 前端构建产物大小
          DIST_SIZE=$(du -sh "${{ inputs.build-output-dir }}" 2>/dev/null | awk '{print $1}')
          [ -z "$DIST_SIZE" ] && DIST_SIZE="-"

          # Tags 多行合并为单行
          TAGS=$(echo "${{ steps.image-names.outputs.tags }}" | tr '\n' ' ' | sed 's/  */ /g')
          [ -z "$TAGS" ] && TAGS="-"

          if [ "${{ steps.build-push.outcome }}" = "success" ]; then
            BUILD_RESULT="✅ 构建并推送成功"
          else
            BUILD_RESULT="❌ 构建失败"
          fi

          {
            echo "# 🐳 镜像构建报告 · ${{ inputs.app-name }}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 状态 | ${BUILD_RESULT} |"
            echo "| 镜像 | \`${{ steps.image-names.outputs.image-base }}\` |"
            echo "| Tags | ${TAGS} |"
            echo "| 平台 | ${{ env.BUILD_DOCKER_OS }}/${{ env.BUILD_DOCKER_ARCH }} |"
            echo "| 基础镜像 | ${{ inputs.base-image }} |"
            echo "| 构建产物 | ${{ inputs.build-output-dir }}（${DIST_SIZE}） |"
            echo "| Registry | ${{ inputs.docker-registry }} |"
            echo "| 操作人 | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # 发布单生成：tag push 发布模式构建成功后调用公共能力（多 PR 全量收集 + GitHub Release）
  release-note:
    name: 📋 Release Note
    needs: build-docker
    if: >-
      needs.build-docker.result == 'success' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      pull-requests: read # 发布单收集 PR 明细需要
    uses: kamalyes/deploy-pipeline/.github/workflows/release-note.yml@master
    with:
      image-name: ${{ inputs.image-name }}
      platform: ${{ needs.build-docker.outputs.platform }}

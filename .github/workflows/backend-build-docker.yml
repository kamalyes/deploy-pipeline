name: 🐳 Build Docker Image

on:
  workflow_call:
    inputs:
      # ============================================
      # 动态值（每次调用不同，必须传入）
      # ============================================
      binary-name:
        description: 'Binary name'
        required: true
        type: string
      binary-source-dir:
        description: 'Binary source directory'
        required: true
        type: string
      version:
        description: 'Build version'
        required: true
        type: string
      image-base:
        description: 'Base Docker image name without tag'
        required: true
        type: string
      image-name:
        description: 'Complete Docker image name with tag'
        required: true
        type: string
      environment:
        description: 'Deployment environment'
        required: false
        type: string
        default: 'dev'
      # ============================================
      # 可覆盖的静态配置（优先读 vars）
      # ============================================
      docker-registry:
        description: 'Docker registry (overrides vars.DOCKER_REGISTRY)'
        required: false
        type: string
        default: ''
      docker-run-workdir:
        description: 'Docker working directory (overrides vars.DOCKER_RUN_WORKDIR)'
        required: false
        type: string
        default: ''
      http-port:
        description: 'HTTP port (overrides vars.HTTP_PORT, empty/0/none to skip)'
        required: false
        type: string
        default: ''
      rpc-port:
        description: 'RPC port (overrides vars.RPC_PORT, empty/0/none to skip)'
        required: false
        type: string
        default: ''
      ws-port:
        description: 'WebSocket port (overrides vars.WS_PORT, empty/0/none to skip)'
        required: false
        type: string
        default: ''
      pprof-port:
        description: 'Pprof port (overrides vars.PPROF_PORT, empty/0/none to skip)'
        required: false
        type: string
        default: ''
      base-image:
        description: 'Base Docker image for build (overrides vars.BUILD_DOCKER_BASE_IMAGE, default alpine:3.19.1)'
        required: false
        type: string
        default: ''
      timezone:
        description: 'Container timezone'
        required: false
        type: string
        default: 'Asia/Shanghai'
      os:
        description: '目标 OS（为空时回退到 vars.BUILD_DOCKER_OS，再为空用 linux）。需与 build-binary 的 os 一致'
        required: false
        type: string
        default: ''
      arch:
        description: '目标架构（amd64 或 arm64，为空时回退到 vars.BUILD_DOCKER_ARCH，再为空用 amd64）。需与 build-binary 的 arch 一致；build-push-action 用 ${os}/${arch} 标记 manifest，K8s 才能调度到对应架构节点'
        required: false
        type: string
        default: ''
      runner:
        description: 'GitHub runner 标签（默认 ubuntu-latest=2核；可选 ubuntu-latest-4-cores/8-cores/16-cores/32-cores 等更大付费 runner）'
        required: false
        type: string
        default: 'ubuntu-latest'
      extra-copy-dirs:
        description: '额外拷贝到 Docker context 的目录（逗号分隔，支持 src:dest 格式，如 "proto" 或 "proto:./proto,locales:./locales"）'
        required: false
        type: string
        default: ''
    secrets:
      DOCKER_USERNAME:
        description: 'Docker registry username'
        required: false
      DOCKER_PASSWORD:
        description: 'Docker registry password or token'
        required: false

jobs:
  build-docker:
    name: 🐳 Build Docker Image (${{ inputs.os || vars.BUILD_BINARY_OS || 'linux' }}/${{ inputs.arch || vars.BUILD_BINARY_ARCH || 'amd64' }})
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    env:
      # 优先级: input > vars > 硬编码默认值
      DOCKER_REGISTRY: ${{ inputs.docker-registry || vars.DOCKER_REGISTRY || 'ghcr.io' }}
      DOCKER_RUN_WORKDIR: ${{ inputs.docker-run-workdir || vars.DOCKER_RUN_WORKDIR || format('/usr/local/services/{0}', github.event.repository.name) }}
      HTTP_PORT: ${{ inputs.http-port || vars.HTTP_PORT || '' }}
      RPC_PORT: ${{ inputs.rpc-port || vars.RPC_PORT || '9181' }}
      WS_PORT: ${{ inputs.ws-port || vars.WS_PORT || '18085' }}
      PPROF_PORT: ${{ inputs.pprof-port || vars.PPROF_PORT || '6160' }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || github.actor }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}
      BUILD_BINARY_OS: ${{ inputs.os || vars.BUILD_BINARY_OS || 'linux' }}
      BUILD_BINARY_ARCH: ${{ inputs.arch || vars.BUILD_BINARY_ARCH || 'amd64' }}
      # 优先级: input > vars.BUILD_DOCKER_BASE_IMAGE > 硬编码默认值
      BASE_IMAGE: ${{ inputs.base-image || vars.BUILD_DOCKER_BASE_IMAGE || 'alpine:3.19.1' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🖥️ Print Runner Info
        uses: kamalyes/deploy-pipeline/.github/actions/print-runner-info@master

      - name: 📤 Download Binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.binary-name }}-binary
          path: ${{ inputs.binary-source-dir }}

      - name: 📝 Generate Dockerfile
        run: |
          BINARY_SOURCE_DIR="${{ inputs.binary-source-dir }}"
          BUILD_APP_NAME="${{ inputs.binary-name }}"
          DOCKER_RUN_WORKDIR="${{ env.DOCKER_RUN_WORKDIR }}"
          BASE_IMAGE="${{ env.BASE_IMAGE }}"
          TIMEZONE="${{ inputs.timezone }}"
          # 优先级: inputs > vars.BUILD_DOCKER_OS/ARCH > 硬编码默认值
          BUILD_OS="${{ inputs.os || vars.BUILD_DOCKER_OS || 'linux' }}"
          BUILD_ARCH="${{ inputs.arch || vars.BUILD_DOCKER_ARCH || 'amd64' }}"

          echo "=========================================="
          echo "Single-arch Docker build"
          echo "  Platform: ${BUILD_OS}/${BUILD_ARCH}"
          echo "  Binary source dir: ${BINARY_SOURCE_DIR}"
          echo "=========================================="
          ls -lh "${BINARY_SOURCE_DIR}"

          # HTTP 端口可选：部分服务（如纯 WS/gRPC 服务）无 HTTP 端口
          HTTP_EXPOSE=""
          if [ -n "${{ env.HTTP_PORT }}" ] && [ "${{ env.HTTP_PORT }}" != "0" ] && [ "${{ env.HTTP_PORT }}" != "none" ]; then
            HTTP_EXPOSE="EXPOSE ${{ env.HTTP_PORT }}"
          fi

          # RPC 端口可选：gateway 类服务无 gRPC 端口
          RPC_EXPOSE=""
          if [ -n "${{ env.RPC_PORT }}" ] && [ "${{ env.RPC_PORT }}" != "0" ] && [ "${{ env.RPC_PORT }}" != "none" ]; then
            RPC_EXPOSE="EXPOSE ${{ env.RPC_PORT }}"
          fi

          # WebSocket 端口可选：部分服务需要 WebSocket 支持
          WS_EXPOSE=""
          if [ -n "${{ env.WS_PORT }}" ] && [ "${{ env.WS_PORT }}" != "0" ] && [ "${{ env.WS_PORT }}" != "none" ]; then
            WS_EXPOSE="EXPOSE ${{ env.WS_PORT }}"
          fi

          # Pprof 端口可选：部分服务不需要 pprof
          PPROF_EXPOSE=""
          if [ -n "${{ env.PPROF_PORT }}" ] && [ "${{ env.PPROF_PORT }}" != "0" ] && [ "${{ env.PPROF_PORT }}" != "none" ]; then
            PPROF_EXPOSE="EXPOSE ${{ env.PPROF_PORT }}"
          fi

          # locales 目录可选：复制到 binary-source-dir 使 Docker context 最小化（无需 .dockerignore）
          # context 设为 binary-source-dir 后,repo 根的 .git/源码都不会进入 context
          COPY_LOCALES=""
          if [ -d "./locales" ]; then
            cp -r ./locales "${BINARY_SOURCE_DIR}/locales"
            COPY_LOCALES="COPY ./locales ./locales"
          fi

          # 额外目录拷贝：将指定目录复制到 Docker context（支持 src:dest 格式）
          EXTRA_COPY=""
          EXTRA_DIRS_INPUT="${{ inputs.extra-copy-dirs }}"
          if [ -n "${EXTRA_DIRS_INPUT}" ]; then
            IFS=',' read -ra EXTRA_DIR_ARRAY <<< "${EXTRA_DIRS_INPUT}"
            for dir_entry in "${EXTRA_DIR_ARRAY[@]}"; do
              dir_entry=$(echo "$dir_entry" | xargs)
              if [ -z "$dir_entry" ]; then continue; fi
              # 支持 "src" 或 "src:dest" 格式
              if [[ "$dir_entry" == *":"* ]]; then
                src="${dir_entry%%:*}"
                dest="${dir_entry#*:}"
              else
                src="$dir_entry"
                dest="$dir_entry"
              fi
              src=$(echo "$src" | xargs)
              dest=$(echo "$dest" | xargs)
              if [ -d "./${src}" ]; then
                dest_parent=$(dirname "${dest}")
                [ "$dest_parent" != "." ] && mkdir -p "${BINARY_SOURCE_DIR}/${dest_parent}"
                rm -rf "${BINARY_SOURCE_DIR:?}/${dest}"
                cp -r "./${src}" "${BINARY_SOURCE_DIR}/${dest}"
                EXTRA_COPY="${EXTRA_COPY}$(printf '\nCOPY ./%s ./%s' "${dest}" "${dest}")"
                echo "📋 已复制额外目录: ${src} -> ${dest}"
              else
                echo "⚠️ 额外目录不存在: ${src}，跳过"
              fi
            done
          fi

          # 生成单架构 Dockerfile
          # build-push-action 通过 platforms=linux/${BUILD_ARCH} 把镜像 manifest 标记为对应架构
          cat << EOF > ${BINARY_SOURCE_DIR}/Dockerfile
          FROM ${BASE_IMAGE}
          USER root
          STOPSIGNAL 37
          WORKDIR ${DOCKER_RUN_WORKDIR}
          COPY ./${BUILD_APP_NAME} ./${BUILD_APP_NAME}
          ${COPY_LOCALES}
          ${EXTRA_COPY}
          RUN chmod +x ./${BUILD_APP_NAME}
          RUN rm -rf ./resources && mkdir -p ./resources
          ${HTTP_EXPOSE}
          ${RPC_EXPOSE}
          ${WS_EXPOSE}
          ${PPROF_EXPOSE}
          CMD ["sh", "-c", "./${BUILD_APP_NAME}"]
          EOF

          echo ""
          echo "=== Generated Dockerfile ==="
          cat ${BINARY_SOURCE_DIR}/Dockerfile
          echo "============================"

      - name: 🔐 Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Normalize Docker Image Names
        id: image-names
        uses: kamalyes/deploy-pipeline/.github/actions/normalize-image-name@master
        with:
          image-base: ${{ inputs.image-base }}
          image-name: ${{ inputs.image-name }}
          generate-tags: 'true'

      - name: 📊 Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-names.outputs.image-base }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: 🔨 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.binary-source-dir }}
          file: ${{ inputs.binary-source-dir }}/Dockerfile
          push: true
          # 关键：用 ${os}/${arch} 标记镜像 manifest 平台，K8s 调度到对应架构节点时才能正确拉取
          # 优先级: inputs > vars.BUILD_DOCKER_OS/ARCH > 硬编码默认值
          # 二进制已由 build-binary workflow 用 Go 交叉编译为对应 os/arch，Dockerfile 仅 COPY，无需 QEMU
          platforms: ${{ inputs.os || env.BUILD_DOCKER_OS || 'linux' }}/${{ inputs.arch || env.BUILD_DOCKER_ARCH || 'amd64' }}
          tags: ${{ steps.image-names.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

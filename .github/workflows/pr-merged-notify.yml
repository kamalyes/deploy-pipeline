name: PR Merged Notify

# 公共能力：PR 合并后机器人推送（飞书 / 企业微信 / Telegram，由 provider 入参选择）
# 各仓库薄入口（on: pull_request closed + merged 过滤）通过 workflow_call 调用，
# github 上下文自动为调用方仓库的 PR 事件，需配合 secrets: inherit 传递对应渠道的 webhook secret
on:
  workflow_call:
    inputs:
      provider:
        description: '通知渠道：feishu | wecom | telegram | all | none（默认 all：只发已配置的渠道）'
        required: false
        type: string
        default: 'all'

    secrets:
      # 聚合密钥：一个 secret 装下各渠道 webhook，格式见 scripts/config/schema.yaml
      # [EN] One secret holding every channel's webhook; see scripts/config/schema.yaml
      PIPELINE_SECRETS:
        description: '聚合密钥 YAML（notify.feishu_webhook_url / notify.wecom_* / notify.telegram_*）'
        required: false

permissions:
  contents: read

jobs:
  notify:
    name: Notify
    runs-on: ubuntu-latest
    steps:
      # webhook 凭证先过 resolve-config：secrets.PIPELINE_SECRETS 的 notify 节优先，
      # 没配才回退到同名的单个 secret。解析结果经 GITHUB_ENV 给到下一步，
      # 所以下一步的 if: 依旧按「这个渠道配了没」判断，行为不变
      # [EN] The webhook credentials go through resolve-config first: the notify section wins and
      # the standalone secrets are the fallback. The result reaches the next step through
      # GITHUB_ENV, so its if: condition still skips silently when no channel is configured
      - name: ⚙️ Resolve Pipeline Config
        uses: kamalyes/deploy-pipeline/.github/actions/resolve-config@master
        with:
          secret-sections: notify
          secrets-json: ${{ toJSON(secrets) }}

      # 与 pr-opened-notify 行为对齐：所选渠道的 webhook 未配置（调用方仓库无此 secret）时静默跳过，不红 job
      - name: 📢 Notify
        uses: kamalyes/deploy-pipeline/.github/actions/notify@master
        if: ${{ env.FEISHU_WEBHOOK_URL != '' || env.WECOM_WEBHOOK_URL != '' || env.WECOM_WEBHOOK_KEY != '' || env.TELEGRAM_BOT_TOKEN != '' }}
        with:
          provider: ${{ inputs.provider }}
          status: success
          title: ✅ PR 已合并 · ${{ github.event.repository.name }}
          message: |
            ${{ github.event.pull_request.title }}
            分支：${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}
            作者：@${{ github.event.pull_request.user.login }}　合并：@${{ github.actor }}
            ${{ github.event.pull_request.html_url }}

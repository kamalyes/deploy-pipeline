name: PR Opened Notify

# 公共能力：PR 开启时机器人评论变更摘要并推送（飞书 / 企业微信 / Telegram，由 provider 入参选择）
# 各仓库薄入口（on: pull_request opened）通过 workflow_call 调用，
# github 上下文自动为调用方仓库的 PR 事件，需配合 secrets: inherit 传递对应渠道的 webhook secret
on:
  workflow_call:
    inputs:
      provider:
        description: '通知渠道：feishu | wecom | telegram | all（all 只发已配置的渠道）'
        required: false
        type: string
        default: 'feishu'

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize:
    name: Summarize & Notify
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Generate Summary
        id: summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          PR="${{ github.event.pull_request.number }}"

          # commit 要点（每个 commit 首行）
          gh api --paginate "repos/${REPO}/pulls/${PR}/commits" \
            --jq '.[] | "- " + (.commit.message | split("\n")[0])' > "${RUNNER_TEMP}/commits.txt"

          # 文件变更明细（状态/文件名/增/删）
          # 注意：gh api --jq 只接受一个参数且字符串输出本身即为 raw，不要写 -r（会被当作过滤器导致参数溢出）
          gh api --paginate "repos/${REPO}/pulls/${PR}/files" \
            --jq '.[] | [.status, .filename, (.additions|tostring), (.deletions|tostring)] | @tsv' > "${RUNNER_TEMP}/files.tsv"

          ADDED=$(grep -c "^added" "${RUNNER_TEMP}/files.tsv" || true)
          MODIFIED=$(grep -c "^modified" "${RUNNER_TEMP}/files.tsv" || true)
          REMOVED=$(grep -c "^removed" "${RUNNER_TEMP}/files.tsv" || true)
          TOTAL=$(wc -l < "${RUNNER_TEMP}/files.tsv" | tr -d ' ')

          {
            echo "stat=📦 ${TOTAL} 个文件：➕ ${ADDED} 新增 / 📝 ${MODIFIED} 修改 / ➖ ${REMOVED} 删除（+${{ github.event.pull_request.additions }}/-${{ github.event.pull_request.deletions }} 行）"
          } >> "$GITHUB_OUTPUT"

          # 组装评论与通知正文（飞书 / 企业微信 / Telegram 的 markdown 通用子集）
          {
            echo "body<<SUMMARY_BODY_EOF"
            echo "## 📋 PR 变更摘要"
            echo ""
            echo "📦 ${TOTAL} 个文件：➕ ${ADDED} 新增 / 📝 ${MODIFIED} 修改 / ➖ ${REMOVED} 删除（+${{ github.event.pull_request.additions }}/-${{ github.event.pull_request.deletions }} 行）"
            echo ""
            echo "### Commits"
            echo ""
            cat "${RUNNER_TEMP}/commits.txt"
            echo ""
            echo "### 文件变更"
            echo ""
            awk -F'\t' 'NR<=20 {
              icon="📝"; if ($1=="added") icon="➕"; else if ($1=="removed") icon="➖"
              print icon " " $2 " （+" $3 "/-" $4 "）"
            } NR>20 { c++ } END { if (c>0) print "…等 " c " 个文件" }' "${RUNNER_TEMP}/files.tsv"
            echo "SUMMARY_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 💬 Comment On PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "${{ steps.summary.outputs.body }}"

      # 所选渠道的 webhook 未配置（调用方仓库无此 secret）时静默跳过，不红 job
      - name: 📢 Notify
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          WECOM_WEBHOOK_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        if: ${{ env.FEISHU_WEBHOOK_URL != '' || env.WECOM_WEBHOOK_URL != '' || env.WECOM_WEBHOOK_KEY != '' || env.TELEGRAM_BOT_TOKEN != '' }}
        uses: kamalyes/deploy-pipeline/.github/actions/notify@master
        with:
          provider: ${{ inputs.provider }}
          status: info
          title: 📣 新 PR · ${{ github.event.repository.name }} · ${{ github.event.pull_request.title }}
          message: ${{ steps.summary.outputs.stat }}
